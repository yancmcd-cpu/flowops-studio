<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGlow" x1="154" y1="96" x2="1438" y2="798" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3AAFA9" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#5B7CFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#3AAFA9" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="lineGlow" x1="253" y1="450" x2="1347" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3AAFA9"/>
      <stop offset="0.5" stop-color="#5B7CFF"/>
      <stop offset="1" stop-color="#3AAFA9"/>
    </linearGradient>
    <linearGradient id="chipStroke" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="softBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="lineOuterGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="30" stdDeviation="28" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1600" height="900" rx="40" fill="#0B0F14"/>

  <g opacity="0.9">
    <ellipse cx="296" cy="220" rx="220" ry="140" fill="#3AAFA9" fill-opacity="0.12" filter="url(#softBlur)"/>
    <ellipse cx="1316" cy="690" rx="260" ry="160" fill="#5B7CFF" fill-opacity="0.14" filter="url(#softBlur)"/>
    <ellipse cx="836" cy="470" rx="320" ry="200" fill="url(#bgGlow)" filter="url(#softBlur)"/>
  </g>

  <g filter="url(#lineOuterGlow)">
    <path d="M253 450H1347" stroke="url(#lineGlow)" stroke-opacity="0.45" stroke-width="3"/>
  </g>

  <g>
    <circle cx="253" cy="450" r="10" fill="#3AAFA9"/>
    <circle cx="527" cy="450" r="10" fill="#5B7CFF"/>
    <circle cx="800" cy="450" r="10" fill="#3AAFA9"/>
    <circle cx="1073" cy="450" r="10" fill="#5B7CFF"/>
    <circle cx="1347" cy="450" r="10" fill="#3AAFA9"/>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="115" y="310" width="276" height="280" rx="30" fill="#10151D"/>
    <rect x="115.75" y="310.75" width="274.5" height="278.5" rx="29.25" stroke="url(#chipStroke)" stroke-width="1.5"/>
    <text x="153" y="366" fill="#3AAFA9" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="0.12em">ENQUIRY</text>
    <text x="153" y="426" fill="#E6EDF3" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">Lead comes in</text>
    <text x="153" y="476" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500">DMs, forms, calls,</text>
    <text x="153" y="510" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500">and website enquiries</text>
    <text x="153" y="544" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500">enter one system.</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="389" y="190" width="276" height="280" rx="30" fill="#10151D"/>
    <rect x="389.75" y="190.75" width="274.5" height="278.5" rx="29.25" stroke="url(#chipStroke)" stroke-width="1.5"/>
    <text x="427" y="246" fill="#5B7CFF" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="0.12em">RESPOND</text>
    <text x="427" y="306" fill="#E6EDF3" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">AI replies fast</text>
    <text x="427" y="356" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500">Questions are answered</text>
    <text x="427" y="390" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500">instantly through chat</text>
    <text x="427" y="424" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500">and voice.</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="662" y="310" width="276" height="280" rx="30" fill="#10151D"/>
    <rect x="662.75" y="310.75" width="274.5" height="278.5" rx="29.25" stroke="url(#chipStroke)" stroke-width="1.5"/>
    <text x="700" y="366" fill="#3AAFA9" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="0.12em">QUALIFY</text>
    <text x="700" y="426" fill="#E6EDF3" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">Best leads rise</text>
    <text x="700" y="476" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500">Intent, service type,</text>
    <text x="700" y="510" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500">and fit are checked</text>
    <text x="700" y="544" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500">automatically.</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="936" y="190" width="276" height="280" rx="30" fill="#10151D"/>
    <rect x="936.75" y="190.75" width="274.5" height="278.5" rx="29.25" stroke="url(#chipStroke)" stroke-width="1.5"/>
    <text x="974" y="246" fill="#5B7CFF" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="0.12em">BOOK</text>
    <text x="974" y="306" fill="#E6EDF3" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">Bookings happen</text>
    <text x="974" y="356" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500">Qualified leads move</text>
    <text x="974" y="390" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500">straight into your</text>
    <text x="974" y="424" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500">calendar or next step.</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="1209" y="310" width="276" height="280" rx="30" fill="#10151D"/>
    <rect x="1209.75" y="310.75" width="274.5" height="278.5" rx="29.25" stroke="url(#chipStroke)" stroke-width="1.5"/>
    <text x="1247" y="366" fill="#3AAFA9" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="0.12em">AUTOMATE</text>
    <text x="1247" y="426" fill="#E6EDF3" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">Work keeps moving</text>
    <text x="1247" y="476" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500">Follow-ups, routing,</text>
    <text x="1247" y="510" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500">notifications, and admin</text>
    <text x="1247" y="544" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500">run in the background.</text>
  </g>
</svg>
