<svg width="900" height="1600" viewBox="0 0 900 1600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vBgGlow" x1="160" y1="152" x2="740" y2="1450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3AAFA9" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#5B7CFF" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#3AAFA9" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="vLineGlow" x1="450" y1="255" x2="450" y2="1345" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3AAFA9"/>
      <stop offset="0.5" stop-color="#5B7CFF"/>
      <stop offset="1" stop-color="#3AAFA9"/>
    </linearGradient>
    <linearGradient id="vChipStroke" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="vSoftBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="vLineOuterGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="vCardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="900" height="1600" rx="40" fill="#0B0F14"/>

  <g opacity="0.9">
    <ellipse cx="260" cy="220" rx="200" ry="130" fill="#3AAFA9" fill-opacity="0.12" filter="url(#vSoftBlur)"/>
    <ellipse cx="670" cy="1360" rx="220" ry="150" fill="#5B7CFF" fill-opacity="0.14" filter="url(#vSoftBlur)"/>
    <ellipse cx="450" cy="800" rx="250" ry="520" fill="url(#vBgGlow)" filter="url(#vSoftBlur)"/>
  </g>

  <g filter="url(#vLineOuterGlow)">
    <path d="M450 255V1345" stroke="url(#vLineGlow)" stroke-opacity="0.42" stroke-width="3"/>
  </g>

  <g>
    <circle cx="450" cy="255" r="10" fill="#3AAFA9"/>
    <circle cx="450" cy="528" r="10" fill="#5B7CFF"/>
    <circle cx="450" cy="800" r="10" fill="#3AAFA9"/>
    <circle cx="450" cy="1072" r="10" fill="#5B7CFF"/>
    <circle cx="450" cy="1345" r="10" fill="#3AAFA9"/>
  </g>

  <g filter="url(#vCardShadow)">
    <rect x="110" y="110" width="680" height="220" rx="30" fill="#10151D"/>
    <rect x="110.75" y="110.75" width="678.5" height="218.5" rx="29.25" stroke="url(#vChipStroke)" stroke-width="1.5"/>
    <text x="156" y="170" fill="#3AAFA9" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="0.12em">ENQUIRY</text>
    <text x="156" y="228" fill="#E6EDF3" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700">Lead comes in</text>
    <text x="156" y="276" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500">DMs, forms, calls, and website enquiries enter one system.</text>
  </g>

  <g filter="url(#vCardShadow)">
    <rect x="110" y="383" width="680" height="220" rx="30" fill="#10151D"/>
    <rect x="110.75" y="383.75" width="678.5" height="218.5" rx="29.25" stroke="url(#vChipStroke)" stroke-width="1.5"/>
    <text x="156" y="443" fill="#5B7CFF" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="0.12em">RESPOND</text>
    <text x="156" y="501" fill="#E6EDF3" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700">AI replies fast</text>
    <text x="156" y="549" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500">Questions are answered instantly through chat and voice.</text>
  </g>

  <g filter="url(#vCardShadow)">
    <rect x="110" y="655" width="680" height="220" rx="30" fill="#10151D"/>
    <rect x="110.75" y="655.75" width="678.5" height="218.5" rx="29.25" stroke="url(#vChipStroke)" stroke-width="1.5"/>
    <text x="156" y="715" fill="#3AAFA9" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="0.12em">QUALIFY</text>
    <text x="156" y="773" fill="#E6EDF3" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700">Best leads rise</text>
    <text x="156" y="821" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500">Intent, service type, and fit are checked automatically.</text>
  </g>

  <g filter="url(#vCardShadow)">
    <rect x="110" y="927" width="680" height="220" rx="30" fill="#10151D"/>
    <rect x="110.75" y="927.75" width="678.5" height="218.5" rx="29.25" stroke="url(#vChipStroke)" stroke-width="1.5"/>
    <text x="156" y="987" fill="#5B7CFF" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="0.12em">BOOK</text>
    <text x="156" y="1045" fill="#E6EDF3" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700">Bookings happen</text>
    <text x="156" y="1093" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500">Qualified leads move straight into your calendar or next step.</text>
  </g>

  <g filter="url(#vCardShadow)">
    <rect x="110" y="1200" width="680" height="220" rx="30" fill="#10151D"/>
    <rect x="110.75" y="1200.75" width="678.5" height="218.5" rx="29.25" stroke="url(#vChipStroke)" stroke-width="1.5"/>
    <text x="156" y="1260" fill="#3AAFA9" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="0.12em">AUTOMATE</text>
    <text x="156" y="1318" fill="#E6EDF3" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700">Work keeps moving</text>
    <text x="156" y="1366" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500">Follow-ups, routing, notifications, and admin run in the background.</text>
  </g>
</svg>
